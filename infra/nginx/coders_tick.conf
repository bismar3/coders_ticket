# Nginx: única puerta de entrada de coders_tick (v1, servidor Ubuntu).
# Sirve la web compilada (frontend/dist) y reenvía /api/<servicio>/ al servicio que corresponde.
# payments y notifications NO se publican: solo los llaman otros servicios por la red interna.
#
# Instalación:
#   sudo cp infra/nginx/coders_tick.conf /etc/nginx/sites-available/coders_tick
#   sudo ln -s /etc/nginx/sites-available/coders_tick /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream auth_svc     { server 127.0.0.1:8001; }
upstream events_svc   { server 127.0.0.1:8002; }
upstream orders_svc   { server 127.0.0.1:8003; }
upstream tickets_svc  { server 127.0.0.1:8005; }
upstream checkin_svc  { server 127.0.0.1:8007; }

server {
    listen 80;
    server_name _;

    root /opt/coders_tick/frontend/dist;
    index index.html;
    client_max_body_size 6m;   # imágenes de eventos (máx. 5 MB)

    # Cabeceras comunes hacia los servicios
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    # /api/<servicio>/... -> servicio (se quita solo el prefijo /api)
    location /api/auth/    { proxy_pass http://auth_svc/auth/; }
    location /api/events/  { proxy_pass http://events_svc/events/; }
    location /api/orders/  { proxy_pass http://orders_svc/orders/; }
    location /api/tickets/ { proxy_pass http://tickets_svc/tickets/; }
    location /api/checkin/ { proxy_pass http://checkin_svc/checkin/; }

    # Rutas exactas sin barra final (p. ej. POST /api/orders, POST /api/checkin)
    location = /api/events  { proxy_pass http://events_svc/events; }
    location = /api/orders  { proxy_pass http://orders_svc/orders; }
    location = /api/checkin { proxy_pass http://checkin_svc/checkin; }

    # Cualquier otra ruta /api/ (por ejemplo /api/payments) no existe hacia afuera
    location /api/ { return 404; }

    # Archivos estáticos de la web con caché larga (llevan hash en el nombre)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta la resuelve React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
